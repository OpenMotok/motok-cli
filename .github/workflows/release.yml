name: Release

# Push a tag such as v0.1.0 to build all archives and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: sh scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/motok_"$GITHUB_REF_NAME"_* dist/SHA256SUMS install.sh install.ps1 \
            --title "$GITHUB_REF_NAME" --generate-notes
