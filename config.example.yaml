version: 1
language: en

channels:
  motok:
    protocol: openai # Optional; defaults to openai
    base_url: https://YOUR_API_HOST/v1
    api_key: "" # Or remove this line and use: api_key_env: MOTOK_API_KEY

routes:
  text:
    channel: motok
    model: YOUR_TEXT_MODEL_ID
  image:
    channel: motok
    model: dola-seedream-5-5-261028 # Seedream 5.5
  video:
    channel: motok
    model: dreamina-seedance-2-0-mini-260615 # Seedance 2.0 Mini
